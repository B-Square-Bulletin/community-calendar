name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for diff

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: uv sync

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate feed/scraper consistency
        run: python scripts/validate_pr_feeds.py --base-ref origin/${{ github.base_ref }}

      - name: Run Python tests
        run: pytest tests/ -v

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations to local database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db supabase/tests/

  perf-gate:
    # Guards the collapseLongRunningEvents content-key cache (issue #77) so a
    # regression fails here in the PR instead of after a fork has merged it.
    # Adopted from the B-Square fork's ADR 0004 verification protocol.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify collapse-cache regression gate
        run: node scripts/bench_collapse_long.js

  brand-chrome:
    # Static chrome check for #86: file-content assertions over BrandHeader /
    # BrandFooter markup. Fast pre-check (bare node, no browser); source of
    # truth stays the Brand chrome group in xmlui/test.html (Playwright step).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify brand chrome (#86)
        run: node scripts/validate_brand_chrome.js

  lint:
    # Mirrors the local lint target (make lint): ruff (format + check) and the
    # four type checkers (pyright, ty, pyrefly, zuban) all gate the job, so an
    # introduced finding fails the PR (ADR 0006 — phased rollout complete).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: uv sync

      - name: Run lint (ruff + type checkers)
        run: make lint
