<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Community Calendar</title>
    <!-- BSB font delivery (#87): Lora (body) + Inter (brand chrome) via the
      reusable public form of the paper's own delivery (Ghost self-hosts
      Inter v12 latin 400-700 and Lora v25 latin 400-700 + italics; Google
      Fonts serves the same families/weights). Theme/markup fontFamily
      stacks stay as the fallback floor. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" />
    <script>
      // Cache-bust shell.js and shell.css. APP_VERSION isn't available yet
      // (shell.js sets it), so use Date.now() — these files are small.
      var _ccCacheBust = '?_=' + Date.now();
      document.write('<link rel="stylesheet" href="shell.css' + _ccCacheBust + '">');
    </script>
    <script>
      // async-boot-fetches (#82 item 4): start the small boot resources
      // downloading in parallel immediately, overlapping the CDN scripts
      // below; shell.js awaits window.__ccBootFetches before injecting
      // the engine scripts.
      (function () {
        var isLocal = /^(localhost|127(?:\.\d+){3}|0\.0\.0\.0)$/.test(location.hostname) || location.protocol === 'file:';
        var j = function (u) { return fetch(u).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); };
        var t = function (u) { return fetch(u).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }); };
        window.__ccBootFetches = {
          localConfig: isLocal ? t('config.local.js' + _ccCacheBust) : Promise.resolve(''),
          config: j('config.json' + _ccCacheBust),
          version: t('version.txt' + _ccCacheBust),
          categories: j('../categories.json' + _ccCacheBust),
          cities: j('../cities.json' + _ccCacheBust),
          sourcePriority: j('../source_priority.json' + _ccCacheBust)
        };
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/rrule@2.8.1/dist/es5/rrule.min.js"></script>
    <script>
      // Cache-bust boot-decisions.js like shell.js below: post-deploy
      // clients must not run stale theme/city decisions from first paint.
      document.write('<script src="boot-decisions.js' + _ccCacheBust + '"><\/script>');
    </script>
    <script>
      document.write('<script src="shell.js' + _ccCacheBust + '"><\/script>');
    </script>
    <script>
      // PROTOTYPE (throwaway, branch prototype/date-filter-variants, never
      // merge): preset math for the ?variant=A|B|C filter prototypes. Loaded
      // unconditionally; it only defines functions, no side effects.
      document.write('<script src="prototype-filter.js' + _ccCacheBust + '"><\/script>');
    </script>
  </head>
  <body>
  </body>
</html>
