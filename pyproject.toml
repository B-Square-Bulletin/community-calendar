[project]
name = "community-calendar"
version = "0.1.0"
description = "Community calendar build pipeline: ICS feeds and scrapers merged into events.json"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4==4.15.0",
  "requests==2.34.2",
  "urllib3==2.8.0",
  "feedparser==6.0.12",
  "icalendar>=7.0.0,<8.0.0",
  "recurring-ical-events>=3.1.0",
  "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.4",
  "ruff==0.16.2",
  "pyrefly==1.5.0",
  "types-requests==2.33.0.20260906",
  "types-pyyaml==6.0.12.20261113",
]

[tool.uv]
package = false
# charset-normalizer is transitive (via requests), which allows 2.x and
# 3.x. Constrain it to the 3.x line so the deliberate decoding change in
# ADR 0015 cannot silently revert on a future re-resolve.
constraint-dependencies = ["charset-normalizer>=3"]

[tool.ruff]
line-length = 100
target-version = "py314"
force-exclude = true

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C4",
  "PIE",
  "TCH",
  "PTH",
  "DTZ",
]
allowed-confusables = ["–", "—", "’", "‘"]

[tool.ruff.lint.isort]
known-first-party = ["scrapers"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["scripts/**", "scrapers/**", "tests/**"]
project-excludes = [".worktrees/**"]
search-path = ["scripts", "scrapers"]
# Fail loudly if a stale binary runs instead of checking with different rules.
required-version = "==1.5.0"

[tool.pyrefly.errors]
# Carry-over of mypy's warn_unused_ignores, which has no single pyrefly knob.
unused-ignore = "warn"
unused-type-ignore = "warn"
