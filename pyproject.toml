[project]
name = "community-calendar"
version = "0.1.0"
description = "Community calendar build pipeline: ICS feeds and scrapers merged into events.json"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4==4.15.0",
  "pytz==2026.4",
  "requests==2.34.2",
  "urllib3==2.8.0",
  "feedparser==6.0.12",
  "icalendar>=7.0.0,<8.0.0",
  "recurring-ical-events>=3.1.0",
  "Jinja2==3.1.6",
  "anthropic>=0.18.0",
  "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
  "ty==0.0.69",
  "pyrefly==1.2.0",
  "pyright==1.1.411",
  "zuban==0.9.1",
  "types-pytz==2026.4.0.20260926",
  "types-requests==2.33.0.20260906",
]

[tool.uv]
package = false
# charset-normalizer is transitive (via requests), which allows 2.x and
# 3.x. Constrain it to the 3.x line so the deliberate decoding change in
# ADR 0015 cannot silently revert on a future re-resolve.
constraint-dependencies = ["charset-normalizer>=3"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["legacy"]
force-exclude = true

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C4",
  "PIE",
  "TCH",
  "PTH",
  "DTZ",
]
allowed-confusables = ["–", "—", "’", "‘"]

[tool.ruff.lint.isort]
known-first-party = ["scrapers"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = ["legacy", ".venv", ".worktrees"]
extraPaths = ["scripts", "scrapers"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["scripts", "scrapers"]

[tool.ty.src]
exclude = ["legacy", ".venv", ".worktrees"]

[tool.pyrefly]
python-version = "3.14"
project_includes = ["scripts/**", "scrapers/**", "tests/**"]
project_excludes = ["legacy/**", ".worktrees/**"]
search_path = ["scripts", "scrapers"]

[tool.mypy]
python_version = "3.14"
exclude = 'legacy|\.venv|\.worktrees'
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
